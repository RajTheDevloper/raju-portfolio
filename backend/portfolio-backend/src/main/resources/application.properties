# =========================================================
# COMMON APPLICATION CONFIGURATION
# =========================================================

spring.application.name=portfolio-backend

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:raju_portfolio}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true

# Existing database was already baselined
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing database schema

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# =========================================================
# ADMIN
# =========================================================

app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# =========================================================
# SERVER
# =========================================================

server.port=${SERVER_PORT:8081}



















