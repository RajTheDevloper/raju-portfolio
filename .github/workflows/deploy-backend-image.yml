
name: Build and Publish Portfolio Backend

on:
  workflow_dispatch:
    inputs:
      backend_branch:
        description: "Branch containing the backend code to build"
        required: true
        type: choice
        options:
          - feature/backend-setup
          - develop
          - main
        default: feature/backend-setup

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected backend branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend_branch }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/portfolio-backend/pom.xml

      - name: Build and verify Spring Boot backend
        working-directory: backend/portfolio-backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        env:
          REPOSITORY: ${{ github.repository }}
          BACKEND_BRANCH: ${{ inputs.backend_branch }}
        run: |
          IMAGE_NAME="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="$(echo "$BACKEND_BRANCH" | tr '[:upper:]' '[:lower:]' | tr '/' '-')"
          docker buildx build \
            --platform linux/amd64 \
            --file backend/portfolio-backend/Dockerfile \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            --push \
            backend/portfolio-backend
