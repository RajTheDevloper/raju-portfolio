
name: Build and Publish Portfolio Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/portfolio-backend/**"
      - ".github/workflows/deploy-backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify Spring Boot backend
        working-directory: backend/portfolio-backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE_NAME="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker buildx build \
            --platform linux/amd64 \
            --file backend/portfolio-backend/Dockerfile \
            --tag "$IMAGE_NAME:latest" \
            --push \
            backend/portfolio-backend
